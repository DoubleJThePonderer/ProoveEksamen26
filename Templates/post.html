<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}">
    <title>Document</title>
</head>
<body>
    <div class="container">
        {% if session['loggedin'] == True: %}
        <form action="{{ url_for('post') }}" method="post">
            <input type="text" name="titel" placeholder="titel" required>
            <input type="text" type="content" placeholder="type what ever is on your mind today" required>

            <button class="btn" type="submit"></button>
        </form>
        {% else %}
        <h1>You need to log in to post</h1>
        <p><a href="{{ url_for('login')  }}">log in</a> <a href="{{ url_for('register')  }}">register</a></p>
        {% endif %}
    </div>
</body>
</html>
